name: Deploy to TurboCloud via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.boxersoldas.com.br
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.example
            README.md
            logs/**
            tmp/**
            stderr.log
            node_modules/**
            node_modules
            compact.zip
            compacto.zip
            https:/**
            https:.zip
            logs.zip
