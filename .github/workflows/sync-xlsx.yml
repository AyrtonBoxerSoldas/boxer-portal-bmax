name: Sync SharePoint XLSX → JSON

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT (UTC-3)
  workflow_dispatch:

concurrency:
  group: bmax-xlsx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install msal requests openpyxl

      - name: Run sync script
        env:
          MSAL_TOKEN_CACHE: ${{ secrets.MSAL_TOKEN_CACHE }}
        run: python scripts/sync_sharepoint_xlsx.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/*.json 2>/dev/null && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json
          git commit -m "chore: sync xlsx → json $(date -u +%Y-%m-%d)"
          git push
